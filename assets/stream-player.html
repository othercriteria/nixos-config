<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Stream</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "SF Mono", "Fira Code", monospace;
      background: #0a0a0b;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 1280px;
      padding: 1rem;
    }
    video {
      width: 100%;
      background: #111;
      border-radius: 8px;
      aspect-ratio: 16/9;
    }
    .status {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: #151518;
      border-radius: 6px;
      border-left: 3px solid #333;
      font-size: 0.875rem;
    }
    .status.connecting { border-color: #f59e0b; color: #fbbf24; }
    .status.live { border-color: #10b981; color: #34d399; }
    .status.offline { border-color: #ef4444; color: #f87171; }
    .status::before {
      content: "●";
      margin-right: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <video id="player" autoplay playsinline muted controls></video>
    <div id="status" class="status connecting">Connecting...</div>
  </div>
  <script>
    const WHEP_URL = "/rtc/v1/whep/?app=live&stream=main";
    const video = document.getElementById("player");
    const status = document.getElementById("status");
    let generation = 0;

    function setStatus(kind, text) {
      status.className = "status " + kind;
      status.textContent = text;
    }

    function liveLabel() {
      return video.muted ? "Live - tap the video for sound" : "Live";
    }

    // Host candidates are often ready immediately, but the offer must
    // include them. WHEP here does not trickle. Give up waiting after
    // 1.5s so a stuck gatherer cannot hang the page.
    function waitForIce(pc) {
      if (pc.iceGatheringState === "complete") return Promise.resolve();
      return new Promise((resolve) => {
        const timer = setTimeout(resolve, 1500);
        pc.addEventListener("icegatheringstatechange", () => {
          if (pc.iceGatheringState === "complete") {
            clearTimeout(timer);
            resolve();
          }
        });
      });
    }

    async function connect() {
      const gen = ++generation;
      const pc = new RTCPeerConnection();
      let stopped = false;
      let disconnectTimer = null;

      const giveUp = (message) => {
        if (stopped || gen !== generation) return;
        stopped = true;
        if (disconnectTimer) clearTimeout(disconnectTimer);
        pc.oniceconnectionstatechange = null;
        pc.close();
        setStatus("offline", message);
        setTimeout(() => {
          if (gen === generation) connect();
        }, 3000);
      };

      pc.ontrack = (event) => {
        if (stopped || gen !== generation) return;
        video.srcObject = event.streams[0];
        setStatus("live", liveLabel());
      };

      // "disconnected" is often transient. Retrying on it, without
      // closing the old peer connection, stacked a new connection
      // every few seconds for as long as the tab stayed open.
      pc.oniceconnectionstatechange = () => {
        if (stopped || gen !== generation) return;
        if (disconnectTimer) {
          clearTimeout(disconnectTimer);
          disconnectTimer = null;
        }
        const state = pc.iceConnectionState;
        if (state === "failed") {
          giveUp("Stream offline - retrying...");
        } else if (state === "disconnected") {
          setStatus("offline", "Connection blipped - waiting...");
          disconnectTimer = setTimeout(() => {
            if (!stopped && gen === generation &&
                pc.iceConnectionState === "disconnected") {
              giveUp("Stream offline - retrying...");
            }
          }, 5000);
        } else if (state === "connected" || state === "completed") {
          setStatus("live", liveLabel());
        }
      };

      try {
        setStatus("connecting", "Connecting...");
        pc.addTransceiver("video", { direction: "recvonly" });
        pc.addTransceiver("audio", { direction: "recvonly" });
        const offer = await pc.createOffer();
        if (stopped || gen !== generation) return;
        await pc.setLocalDescription(offer);
        await waitForIce(pc);
        if (stopped || gen !== generation) {
          pc.close();
          return;
        }
        const res = await fetch(WHEP_URL, {
          method: "POST",
          headers: { "Content-Type": "application/sdp" },
          body: pc.localDescription.sdp
        });
        if (!res.ok) throw new Error("WHEP request failed");
        const answer = await res.text();
        if (stopped || gen !== generation) {
          pc.close();
          return;
        }
        await pc.setRemoteDescription({ type: "answer", sdp: answer });
      } catch (err) {
        giveUp("Stream offline - retrying...");
      }
    }

    video.addEventListener("click", () => {
      video.muted = false;
      if (status.classList.contains("live")) setStatus("live", "Live");
    });

    connect();
  </script>
</body>
</html>
